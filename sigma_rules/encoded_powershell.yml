title: Encoded PowerShell Command Line
id: sigma-encoded-powershell-001
description: Detects PowerShell execution with an encoded command flag, a common obfuscation/delivery technique.
status: stable
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process_name|endswith: 'powershell.exe'
    command_line|contains: '-enc'
  condition: selection
tags:
  - attack.execution
  - attack.t1059.001
